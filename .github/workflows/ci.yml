
name: STM32 Heliostat CI

on:
  push:
    branches:
      - main
      - feat/lab2-sensor-integration

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test and Architecture Check
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check build tools
        run: |
          docker --version
          make --version

      - name: Build Docker image
        run: docker build -t stm32-build ./docker

      - name: Check architecture dependencies
        run: make arch-check

      - name: Run unit tests
        run: make test

      - name: Check unit test coverage
        run: make coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heliostat-coverage-report
          path: build/coverage/html/
          if-no-files-found: warn

      - name: Build STM32 firmware
        run: make build

      - name: Verify firmware files
        run: |
          test -s build/debug/build/stm32-hello-wokwi.elf
          test -s build/debug/build/stm32-hello-wokwi.hex
          test -s build/debug/build/stm32-hello-wokwi.bin

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stm32-heliostat-firmware
          path: |
            build/debug/build/stm32-hello-wokwi.elf
            build/debug/build/stm32-hello-wokwi.hex
            build/debug/build/stm32-hello-wokwi.bin
          if-no-files-found: error
          retention-days: 7
